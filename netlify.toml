[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keeps the frontend's fetch("/api/send-otp") calls working unchanged —
# Netlify's actual function URLs are /.netlify/functions/<name>, this just
# maps the friendlier /api/<name> path to that automatically.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so refreshing or deep-linking never 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
